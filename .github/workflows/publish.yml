name: Publish QuietPass node

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version to publish
        required: true
        type: string
      publish:
        description: Publish the reviewed package to npm (otherwise validation only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: quietpass-node-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
          cache: true
      - name: Validate release identity
        env:
          REVIEWED_VERSION: ${{ inputs.version }}
        run: |
          node - <<'JS'
          const p = require('./package.json');
          if (p.name !== 'n8n-nodes-quietpass' || p.version !== process.env.REVIEWED_VERSION || !/^\d+\.\d+\.\d+$/.test(p.version)) throw Error('Release identity mismatch');
          if (p.repository.url !== 'https://github.com/c9-ventures-ltd/n8n-nodes-quietpass.git') throw Error('Repository mismatch');
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Inspect package before publishing
        run: pnpm pack --out /tmp/quietpass-node.tgz
      - name: Publish reviewed package with npm provenance
        if: inputs.publish
        run: pnpm release
        env:
          # Initial package creation may need a short-lived bootstrap token.
          # Remove it after configuring npm Trusted Publishing for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
